name: Build and publish review draft

on:
  push:
    branches: [review/author-review-2026-11-20]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.38'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check sources
        run: |
          python scripts/sync_metadata.py
          python scripts/chapter_bibliographies.py --check
          python scripts/validate.py
      - name: Build clean reading formats
        run: quarto render --to all
      - name: Check rendered site and draft labels
        run: |
          python scripts/validate_citations.py --rendered
          python scripts/validate_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: author-review-reading-copy
          path: _book
          retention-days: 30
      - name: Package Pages site
        if: vars.PUBLISH_REVIEW == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    if: vars.PUBLISH_REVIEW == 'true' && github.ref == 'refs/heads/review/author-review-2026-11-20'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish clearly labelled review draft
        id: deployment
        uses: actions/deploy-pages@v4
